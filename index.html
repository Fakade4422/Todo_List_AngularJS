<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do List</title>

    <!-- Supporting links for project -->
     <script src="./app/lib/angular.min.js"></script>

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="./components/addNewTask/addNewTask.css" />
    <link rel="stylesheet" href="./components/ListOfItems/list.css" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=nest_farsight_dual" />
</head>
<body>
    <div class="content" ng-app="todoApp" ng-controller="addNewTaskCtrl">
        <h1>TODO LIST</h1>

        <div ng-include="'./components/ListOfItems/list.html'"></div>

        <div class="task p-3" ng-show="tasks.length === 0">
            <span class="title fw-bold" style="font-style: italic; text-align: center; width: 100%;">There are no tasks to display</span>
        </div>

        <div ng-include= "'./components/addNewTask/addNewTask.html'"></div>
        
    </div>

    <script src="./app.js"></script>
    <script src="./components/addNewTask/addNewTask.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
